android.useAndroidX=true
android.enableJetifier=false
hermesEnabled=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
newArchEnabled=true

# Physical ARM devices only. Without this the RN gradle plugin leaves ndk.abiFilters
# empty and every AAR's x86/x86_64 slice is packaged too - ~51 MB of the APK.
#
# This is the floor for EVERY variant. Debug adds x86_64 on top of it, in the
# debug buildType's `ndk.abiFilters` in app/build.gradle, so an emulator runs the
# app natively (PearCal #160) while release APKs stay ARM-only. Change the list
# here and both variants move; add an ABI there and only debug gets it.
reactNativeArchitectures=arm64-v8a,armeabi-v7a
