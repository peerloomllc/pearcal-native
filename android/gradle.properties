android.useAndroidX=true
android.enableJetifier=false
hermesEnabled=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
newArchEnabled=true

# Physical ARM devices only. Without this the RN gradle plugin leaves ndk.abiFilters
# empty and every AAR's x86/x86_64 slice is packaged too - ~51 MB of the APK.
#
# reactNativeArchitectures is NOT set here. It is chosen per build in
# android/build.gradle: debug adds x86_64 so an emulator runs the app natively
# (suite rule 15, PearCal #160), release stays ARM-only so the APK does not grow
# 3.7 MB of libraries no phone can run. Pass -PreactNativeArchitectures=... to
# override either, which is what scripts/release.sh does.
