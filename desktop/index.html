<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PearCal</title>
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; background: #0f172a; }
    body { font-family: -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; color: #e2e8f0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    All renderer code stays inline in this file by necessity: external
    <script src="./x.js" type="module"> in Pear's renderer is wrapped through
    node-bare-bundle as CJS, which kills top-level await and crashes the renderer.
    See feedback_pear_renderer_inline_modules.md memory.
  -->

  <!-- Phase 1 IPC bridge: spawns a bare worker, frames JSON-newline messages,
       installs window.__pearDB / __pearResponse / __pearEvent so the existing
       src/ui/main.jsx + App.jsx work unchanged. -->
  <script>
    const pipe = Pear.worker.run('./bare-worker.js')

    const _pending = new Map()
    let _nextId = 1
    let _buf = ''
    const _decoder = new TextDecoder('utf-8')

    pipe.on('data', (chunk) => {
      _buf += _decoder.decode(chunk, { stream: true })
      let i
      while ((i = _buf.indexOf('\n')) >= 0) {
        const line = _buf.slice(0, i); _buf = _buf.slice(i + 1)
        if (!line) continue
        let msg
        try { msg = JSON.parse(line) } catch (e) { console.error('[desktop] bad pipe frame:', e, line); continue }
        if (msg.event) {
          window.dispatchEvent(new CustomEvent('pear:' + msg.event, { detail: msg.data }))
        } else if (typeof msg.id === 'number') {
          const r = _pending.get(msg.id)
          if (r) { _pending.delete(msg.id); r(msg) }
        }
      }
    })
    pipe.on('error', (e) => console.error('[desktop] worker pipe error:', e.message))
    pipe.on('close', () => console.warn('[desktop] worker pipe closed'))

    const _encoder = new TextEncoder()
    function send (obj) { pipe.write(_encoder.encode(JSON.stringify(obj) + '\n')) }

    // Hand the worker its dataDir before the UI bundle starts making __pearDB
    // calls. bare.js's dispatch awaits _dbReady, so any inflight requests park
    // until init() finishes. The trailing '/pearcal' keeps storage scoped per
    // app (mobile mirrors this with FileSystem.documentDirectory + 'pearcal/').
    send({ method: 'init', dataDir: Pear.config.storage + '/pearcal', platform: 'desktop' })

    function _showToast (text) {
      const t = document.createElement('div')
      t.textContent = text
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:10px 18px;border-radius:10px;font:13px -apple-system,system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:99999;opacity:0;transition:opacity 180ms;pointer-events:none;'
      document.body.appendChild(t)
      requestAnimationFrame(() => { t.style.opacity = '1' })
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 220) }, 2200)
    }

    function _downloadBlob (filename, mimeType, content) {
      try {
        const blob = new Blob([content], { type: mimeType })
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url; a.download = filename; a.style.display = 'none'
        document.body.appendChild(a)
        a.click()
        setTimeout(() => { a.remove(); URL.revokeObjectURL(url) }, 200)
        _showToast('Downloading ' + filename)
      } catch (e) {
        _showToast('Download error: ' + (e?.message ?? e))
      }
    }

    window.__pearDB = {
      call (method, ...args) {
        // Native-module replacements handled directly in the renderer. These
        // mirror the methods that mobile's RN shell intercepts before they
        // reach the bare worklet (see app/index.tsx:446-481).
        switch (method) {
          case 'openURL':
            // Pear's renderer (Electron) routes window.open to the OS shell for
            // every scheme we need (https / mailto / geo / lightning / etc.).
            try { window.open(args[0], '_blank') } catch (e) { return Promise.reject(e) }
            return Promise.resolve(null)
          case 'openLightning':
            try { window.open(args[0], '_blank') } catch (e) { return Promise.reject(e) }
            return Promise.resolve(null)
          case 'canOpenLightning':
            // UI listens for the 'pear:canOpenLightning' CustomEvent (set up by
            // src/ui/main.jsx). On desktop we can't probe registered handlers,
            // so always claim true — window.open delegates to the OS, which
            // will show its own error if no handler is installed.
            queueMicrotask(() => window.__pearEvent('canOpenLightning', true))
            return Promise.resolve(null)
          case 'nativeShare': {
            // On mobile this pops the OS share sheet. Desktop Linux doesn't
            // have one, so copy text to clipboard and toast.
            const [title, text] = args
            navigator.clipboard.writeText(String(text ?? '')).then(
              () => _showToast((title ? title + ' — c' : 'C') + 'opied to clipboard'),
              (e) => _showToast('Could not copy: ' + (e?.message ?? e))
            )
            return Promise.resolve(null)
          }
          case 'exportIcs':
            _downloadBlob('pearcal-events.ics', 'text/calendar', String(args[0] ?? ''))
            return Promise.resolve(null)
          case 'exportRecoveryPhrase':
            _downloadBlob('pearcal-recovery.txt', 'text/plain', String(args[0] ?? ''))
            return Promise.resolve(null)
          case 'haptic':
            // No haptics on desktop. Fire-and-forget.
            return Promise.resolve(null)
          case 'exitApp':
            try { Pear.exit() } catch (e) { window.close() }
            return Promise.resolve(null)
        }
        return new Promise((resolve, reject) => {
          const id = _nextId++
          _pending.set(id, msg => {
            if (msg.error) reject(new Error(msg.error))
            else resolve(msg.result)
          })
          send({ id, method, args })
        })
      }
    }
    window.__pearResponse = (msg) => {
      const r = _pending.get(msg.id)
      if (r) { _pending.delete(msg.id); r(msg) }
    }
    window.__pearEvent = (event, data) => {
      window.dispatchEvent(new CustomEvent('pear:' + event, { detail: data }))
    }

    // Phase 3.2: pearcal:// deep-link receive.
    //
    // Mobile registers pearcal:// via Android intent-filter + iOS URL types and
    // routes through native LinkModule → RN → window.__pearHandleInvite. On
    // desktop, Pear's runtime supplies two equivalent paths:
    //   • Pear.config.link / linkData — URL the app was cold-launched with
    //   • Pear.wakeups(fn)            — URL arrives while app is running
    // Both feed window.__pearHandleInvite (set up in src/ui/main.jsx, with
    // built-in buffering for invites that arrive pre-mount).
    //
    // In dev mode the OS doesn't register the pearcal:// scheme — that needs
    // the appling's Info.plist (Phase 4). So neither path fires from a real
    // link click here; the wiring is correct for staged builds and a no-op
    // until then.
    function _looksLikeInvite (url) {
      if (typeof url !== 'string' || !url) return false
      return url.startsWith('pearcal://') ||
             url.startsWith('pear://pearcal/') ||
             url.startsWith('https://peerloomllc.com/join')
    }
    function _deliverInvite (url) {
      if (!_looksLikeInvite(url)) return
      // main.jsx defines __pearHandleInvite before the React app mounts, but
      // the UI bundle imports asynchronously after this script runs — retry
      // until the buffer fn exists.
      if (typeof window.__pearHandleInvite !== 'function') {
        setTimeout(() => _deliverInvite(url), 50)
        return
      }
      window.__pearHandleInvite(url)
    }

    const _coldLink = Pear.config?.linkData || Pear.config?.link
    if (_coldLink) _deliverInvite(_coldLink)

    if (typeof Pear.wakeups === 'function') {
      try {
        Pear.wakeups((wakeup) => {
          const url = (typeof wakeup === 'string')
            ? wakeup
            : (wakeup?.link || wakeup?.linkData || wakeup?.url)
          _deliverInvite(url)
        })
      } catch (e) {
        console.error('[desktop] Pear.wakeups setup failed:', e?.message ?? e)
      }
    }
  </script>

  <!-- Inline module: top-level await is valid here. Loads the React UI bundle. -->
  <script type="module">
    try {
      await import('./app-ui-desktop.mjs')
      console.log('[desktop] UI bundle loaded')
    } catch (e) {
      console.error('[desktop] UI bundle import failed:', e)
      const root = document.getElementById('root')
      if (root) root.innerHTML = '<div style="padding:16px;font-family:monospace;color:#f87171">UI bundle failed to load:<br>' + (e?.message ?? e) + '</div>'
    }
  </script>
</body>
</html>
