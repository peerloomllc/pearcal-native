# Per-version release notes for the StartOS package.
#
# build-start9-s9pk.sh copies the entry matching the version being built into
# manifest.yaml's `release-notes`, which is baked into the .s9pk and then
# published by build-registry.sh to
# peerloomllc.com/package/v0/release-notes/pearcal-seeder — the version-keyed
# map StartOS reads for its Updates page.
#
# Nothing used to update that field, so every release since the first shipped
# the original submission blurb: StartOS users updating to 1.0.35 were shown
# "First StartOS release of the PearCal blind-seeder". The build now FAILS if
# the version being built has no entry here, so it cannot silently regress.
#
# Write for a StartOS operator, not a PearCal developer. They run the seeder,
# they do not necessarily use the app. Say what changes about running it.
# Keep it short, no em dashes, no Oxford commas.

"1.0.35": |
  The Properties page now shows this seeder's public key, nickname, how many
  groups it is seeding, connected peers and how much encrypted data it holds.
  Check the public key against what the PearCal app displays when you admit
  this seeder, to confirm you paired with the right one.

  Adds a donation link, and fixes a bug where the Properties page could stay
  empty after a restart.

"1.0.34": |
  First StartOS release of the PearCal blind-seeder. Runs the seed-mode worklet
  as an always-on service with a dashboard for enrolling groups and watching
  replication. Reuses the same published seeder image as the Umbrel app.
