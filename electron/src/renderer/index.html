<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self';" />
  <title>PearCal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; height: 100%; background: #0f172a; }
    body { font-family: -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; color: #e2e8f0; overflow: hidden; }
    /* D5: visible keyboard focus rings for tab navigation. Mouse focus
       (`:focus` without `:focus-visible`) stays unstyled so click ≠ ring. */
    button:focus { outline: none; }
    input:focus, textarea:focus, select:focus { outline: none; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid #C8922A;
      outline-offset: 1px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./app-ui-electron.js"></script>
</body>
</html>
